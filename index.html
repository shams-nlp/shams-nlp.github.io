<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAMS</title>
<meta name="description" content="SHAMS">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="SHAMS">
<meta property="og:image" content="https://shams-nlp.github.io/shams-logo.png">
<style>
  :root {
    --ground: #faf9f7;
    --ink: #1c1c1c;
    --accent: #eb6a2e;
  }
  html { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--ground);
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  img {
    width: 100%;
    height: auto;
    display: block;
    animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    img { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <img src="shams-logo.png" alt="SHAMS" width="1147" height="868">
  </main>
</body>
</html>
